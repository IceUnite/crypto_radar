name: crypto_radar
description: A crypto tracking app built with Flutter, GetX, and WebSocket.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  get: ^4.6.6
  go_router: ^13.2.0
  dio: ^5.4.1
  shared_preferences: ^2.2.2
  firebase_core: ^2.25.4
  firebase_messaging: ^14.7.10
  web_socket_channel: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^5.1.0

flutter:
  uses-material-design: true
